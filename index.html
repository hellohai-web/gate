<style>#sg{--bg:#f9fafb;--fg:#111827;--mut:#6b7280;--card:#fff;--bd:#e5e7eb;--ac:#059669;--er:#b91c1c;--wa:#fef3c7;--wf:#92400e;position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);padding:16px;overflow:auto;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
@media (prefers-color-scheme:dark){#sg{--bg:#0b1110;--fg:#ecfdf5;--mut:#9ca3af;--card:#121a18;--bd:#24312e;--ac:#10b981;--er:#f87171;--wa:#3b2f0b;--wf:#fcd34d}}
#sg *{box-sizing:border-box}#sg [hidden]{display:none!important}
#sg .sg-card{width:100%;max-width:400px;margin:auto;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px}
#sg .sg-lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:6px}
#sg .sg-lang button{width:auto;margin:0;padding:3px 10px;border:1px solid var(--bd);border-radius:8px;background:transparent;color:var(--mut);font:600 12px/1.4 inherit;cursor:pointer}
#sg .sg-lang button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
#sg h1{font-size:19px;margin:0 0 4px;font-weight:800}
#sg .sg-sub{margin:0 0 16px;color:var(--mut);font-size:14px}
#sg label{display:block;margin:12px 0 4px;font-size:13px;font-weight:600}
#sg input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:inherit;font:inherit}
#sg input#sg-key{text-transform:uppercase;letter-spacing:.3px}
#sg input:focus-visible,#sg button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#sg .sg-hint{margin-top:4px;color:var(--mut);font-size:12px}
#sg #sg-btn{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}
#sg #sg-btn:disabled{opacity:.6;cursor:wait}
#sg #sg-msg{min-height:20px;margin-top:12px;font-size:14px;line-height:1.4}
#sg #sg-msg.err{color:var(--er)}#sg #sg-msg.info{color:var(--mut)}#sg #sg-msg.ok{color:var(--ac);font-weight:600}
#sg .sg-warn{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--wa);color:var(--wf);font-size:13px}
#sg .sg-note{margin-top:16px;padding-top:12px;border-top:1px solid var(--bd);color:var(--mut);font-size:12px}
</style>

  function b64(s) { var b = atob(s), a = new Uint8Array(b.length), i; for (i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function recheck() {
    post({ a: 'check', fp: fpInfo(), t: getTok() }).then(function (res) {
      if (res.j && res.j.ok === false && (res.j.err === 'device' || res.j.err === 'revoked' || res.j.err === 'none')) location.reload();
    }, function () {});
  }
  function grant(j) {
    try { if (j.t) localStorage.setItem('sdt', j.t); } catch (e) {}
    pw.value = ''; key.value = '';
    say('ok', 'ok');
    if (!window.__sgTimer) window.__sgTimer = setInterval(recheck, 5 * 60 * 1000);
    if (CFG.mode === 'lock') {
      if (!j.k) { setBusy(false); showForm(); say('noAppKey'); return; }
      var d;
      Promise.resolve().then(function () {
        d = b64(CFG.payload);
        return crypto.subtle.importKey('raw', b64(j.k), 'AES-GCM', false, ['decrypt']);
      }).then(function (k) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: d.slice(0, 12) }, k, d.slice(12));
      }).then(function (pt) {
        var html = new TextDecoder().decode(pt);
        document.documentElement.style.overflow = '';
        document.open(); document.write(html); document.close();
      }, function () { setBusy(false); showForm(); say('badAppKey'); });
    } else {
      document.documentElement.style.overflow = '';
      if (root.parentNode) root.parentNode.removeChild(root);
    }
  }

  key.addEventListener('input', function () { key.value = key.value.toUpperCase(); });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    var p = pw.value, k = key.value.replace(/\s+/g, '').toUpperCase();
    if (!p) { say('needPw'); pw.focus(); return; }
    if (!k) { say('needKey'); key.focus(); return; }
    setBusy(true); say('wait', 'info');
    post({ a: 'activate', pw: p, key: k, fp: fpInfo(), t: getTok() }).then(function (res) {
      if (res.j && res.j.ok) return grant(res.j);
      setBusy(false); say(errOf(res), 'err', extraOf(res));
    }, function () { setBusy(false); say(navigator.onLine === false ? 'offline' : 'net'); });
  });

  paint();
  if (location.protocol === 'file:') { say('fileMode'); return; }
  say('checking', 'info');
  post({ a: 'check', fp: fpInfo(), t: getTok() }).then(function (res) {
    if (res.j && res.j.ok) return grant(res.j);
    showForm();
    var e = res.j && res.j.err;
    if (res.status >= 400 || !res.j) say(errOf(res), 'err', extraOf(res));
    else if (e === 'device' || e === 'revoked') say(e);
    else say(null);
  }, function () { showForm(); say(navigator.onLine === false ? 'offline' : 'net'); });
})();
